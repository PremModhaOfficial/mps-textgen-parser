services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4229:4222"
      - "8222:8222"
    command: ["--js", "--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 5

  app:
    build: .
    environment:
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
      APP_ENV: development
    depends_on:
      nats:
        condition: service_healthy
