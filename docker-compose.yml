services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: prem
      POSTGRES_USER: prem
      POSTGRES_PASSWORD: prem
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prem -d prem"]
      interval: 2s
      timeout: 3s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgres://prem:prem@db:5432/prem?sslmode=disable
    ports:
      - "8080:100"
    depends_on:
      db:
        condition: service_healthy
